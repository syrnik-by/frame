task cucumber(type: Test) {
    doFirst {
        environment "cucumber.filter.tags", "@BackendCore"
    }
}

// Задача для запуска копирования хуков из core_base, НЕ нужно переносить в проекты
task hookCopy(type: JavaExec) {
    // установить в true если нужно отключить копирование хуков
    // environment "DISABLE_HOOKS_COPY", "true"
    group = "Execution"
    description = "Copy git hooks from core_base"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "ru.autotestframework.configuration.CopyGitHooks"
}

task componentTesting(type: Test) {
    useJUnitPlatform {
        includeTags '@BackendCore'
    }
}

build.dependsOn(hookCopy)

dependencies {
    api 'org.springframework:spring-aspects:5.3.6'
    api 'org.hibernate.validator:hibernate-validator:6.1.6.Final'

    api 'org.hamcrest:hamcrest:2.2'
    api 'org.hamcrest:hamcrest-core:1.3'
    testImplementation "org.junit.platform:junit-platform-suite:${jUnitEngineVersion}"

    api 'org.xmlunit:xmlunit-placeholders:2.7.0'
    api 'org.xmlunit:xmlunit-core:2.8.2'
    api 'org.skyscreamer:jsonassert:1.5.0'
    api 'commons-io:commons-io:2.11.0'
    api 'org.apache.commons:commons-text:1.9'
    api 'com.google.guava:guava:31.0.1-jre'
    api 'net.datafaker:datafaker:1.1.0'
    api 'io.github.resilience4j:resilience4j-retry:1.6.1'
    api 'javax.mail:mail:1.4.7'

    api 'javax.annotation:javax.annotation-api:1.3.2'
    api 'ch.qos.logback:logback-classic:1.2.3'
    api 'com.sun.mail:smtp:2.0.0'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
}
