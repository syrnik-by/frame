#common variables
framework.ui.driver.web.starting.url=https://gitlab-01/

#framework common settings, no need to duplicate (usually) in other stand properties
framework.ui.timeout=5
framework.ui.page.package=ru.autotestframework.pages
framework.ui.driver.web.reuseBrowserEnabled=true
framework.ui.aspects.tableCache.enabled=true

#local stand specific logic
framework.ui.driver.web.properties.path=framework.properties
framework.ui.driver.web.version=114
framework.ui.driver.web.path=../../drivers/chromedriver126-linux

#selfclosure local stand settings via properties.path
browser.path=/opt/yandex/browser/yandex_browser
browser.logging=all
chromeOptions=--window-size=1920,1080;--incognito;--remote-allow-origins=*;

framework.proxy.enabled=true
framework.proxy.host=127.0.0.1
framework.proxy.port=33334
framework.step.metainfo.enabled=true
framework.variables.loadTestingEnabled=false
framework.variables.loadTestingTestIt=true
framework.variables.loadTestingArtifactDir=build/harDir
