#common variables
framework.variables.url.form=file://${user.dir}/src/test/resources/local_pages/form.html
framework.variables.url.fileDownload=file://${user.dir}/src/test/resources/local_pages/downloads.html
framework.ui.driver.web.starting.url=file://${user.dir}/src/test/resources/local_pages/form.html
framework.variables.url.tablePage=file://${user.dir}/src/test/resources/local_pages/tablePage.html
framework.variables.url.alerts=file://${user.dir}/src/test/resources/local_pages/alerts.html
framework.variables.url.dragAndDropHtml5=file://${user.dir}/src/test/resources/local_pages/dragDropHtml5.html
framework.variables.url.dragAndDrop=file://${user.dir}/src/test/resources/local_pages/dragdrop.html
framework.variables.url.buttons=file://${user.dir}/src/test/resources/local_pages/buttons.html
framework.variables.url.progressBars=file://${user.dir}/src/test/resources/local_pages/multipleProgressBars.html

#framework common settings, no need to duplicate (usually) in other stand properties
framework.ui.timeout=5
framework.ui.page.package=ru.autotestframework.pages
framework.ui.driver.web.reuseBrowserEnabled=true
framework.ui.aspects.tableCache.enabled=true

#local stand specific logic
framework.ui.driver.web.path=/usr/local/share/at-tools/yandexdriver
framework.ui.driver.web.properties.path=framework.properties
framework.ui.driver.web.version=114

#selfclosure local stand settings via properties.path
browser.path=/opt/yandex/browser/yandex_browser
chromeOptions=--remote-allow-origins=*;--start-maximized;--window-size=1920,1080;

