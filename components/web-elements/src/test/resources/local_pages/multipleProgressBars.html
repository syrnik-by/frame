<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
    <title>Multiple Progress Bars</title>
    <link rel="stylesheet" href="./multipleProgressBars_files/testpages.css">

    <!-- HEAD -->

</head><body><div style="display:block;position:fixed;top:0px;left:0px;z-index:9999;width:3px;height:3px;background-color:#005ff9;"></div> 



<div class="page-body">



    <h1>Progress Bars</h1>

    <div class="explanation">
        <p>This page has progress bars buttons representing some 'behind the scenes' processing. Which progress points can you synchronise on?
        </p>
    </div>

    <div class="centered">

        <h2>A Progress Display</h2>

        <div>
            <button id="onclick" class="styled-click-button" onclick="start()">Start</button>
        </div>

        <div id="progressrendering">
            <p id="status" status="">Stopped</p>
            <p id="progress0"><span id="progresstext0">Task 1</span> <progress id="progressbar0" value="100" max="100"></progress></p>
            <p id="progress1"><span id="progresstext1">Task 2</span> <progress id="progressbar1" value="100" max="100"></progress></p>
            <p id="progress2"><span id="progresstext2">Task 3</span> <progress id="progressbar2" value="100" max="100"></progress></p>
        </div>


    </div>


    <div class="page-footer">
    </div>

</div>

<!-- BODY END -->

<script>

    var tasks = [
        {id:0, name:"Task 1", duration:600, markers:4, current:0, delay:100, status:0, inc:0, interval:null},
        {id:1, name:"Task 2", duration:800, markers:4, current:0, delay:200, status:0, inc:0, interval:null},
        {id:2, name:"Task 3", duration:1500, markers:8, current:0, delay:300, status:0, inc:0, interval:null},
    ];

    var statusMonitor;

    function start(){
        document.getElementById("status").innerText="Running";
        tasks.forEach(startTask);
        statusMonitor = setInterval(monitorStatus, 200);
    }

    function monitorStatus(){

        document.getElementById("status").innerText="Running";

        var running=false;
        tasks.forEach(function(task){
            if(task.status!=0){
                running=true;
            }
        });

        if(!running){
            clearInterval(statusMonitor);
            document.getElementById("status").innerText="Stopped";
        }

    }

    function startTask(task, index){

        if(task.status===0){
            task.status=1;
            task.current=0;
            task.inc = task.duration/task.markers;
            renderProgress(task);
            task.interval = setTimeout(updateProgress, task.delay, task);
        }
    }

    function renderProgress(task){
        document.getElementById("progresstext"+task.id).innerText=task.name;
        document.getElementById("progressbar"+task.id).setAttribute("value", (100/task.markers)*task.current);
    }

    function updateProgress(task){
        task.current++;
        if(task.current>task.markers){
            // stop task
            task.status=0;
            task.interval=null;
        }else{
            // keep going
            renderProgress(task);
            task.interval = setTimeout(updateProgress, task.inc, task);
        }
    }

</script>


</body></html>
